# Conda environment for the short-form video / procrastination study
# Reproduce with:  conda env create -f environment.yml
# Then activate:   conda activate shortform-study

name: shortform-study

channels:
  - conda-forge
  - defaults

dependencies:
  # ---- Core Python ----
  - python=3.11.9

  # ---- Scientific stack (pinned) ----
  - numpy=1.26.4
  - pandas=2.2.2
  - scipy=1.13.1
  - statsmodels=0.14.2
  - matplotlib=3.9.2

  # ---- Config / IO ----
  - pyyaml=6.0.1

  # ---- Notebooks (exploratory work) ----
  - jupyter=1.0.0
  - notebook=7.2.0
  - ipykernel=6.29.4

  # ---- Testing / linting ----
  - pytest=8.2.2
  - black=24.4.2
  - flake8=7.0.0

  # ---- pip-only packages (if any) ----
  - pip=24.0
  - pip:
      - pytest-cov==5.0.0
